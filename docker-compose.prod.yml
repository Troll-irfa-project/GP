services:
  roll-rush:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      ROOM_COUNT: "3"
      DB_PATH: /app/data/rollrush.sqlite
      # Pour un déploiement HTTPS derrière un reverse proxy, ajouter :
      # APP_ORIGIN: https://votre-domaine.example
      # COOKIE_SECURE: "true"
    volumes:
      - rollrush-data:/app/data
    networks:
      - web
networks:
  web:
    external: true

volumes:
  rollrush-data:
